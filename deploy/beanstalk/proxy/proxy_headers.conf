# Shared proxy headers, included by every location block in nginx.conf.
#
# X-Forwarded-For matters: the API sets `trust proxy = 1` and derives the
# client IP from this header for IP-based rate limiting. Without it every
# request appears to come from the proxy container and the login rate limit
# (10 attempts per 5 minutes per IP) would apply to all users at once.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

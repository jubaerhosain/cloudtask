# Reverse proxy for the CloudTask Elastic Beanstalk environment.
#
# Reproduces the ALB listener rules that the ECS runbooks configure on the load
# balancer: /api/, /health, /ready and /docs go to the api container, and
# everything else goes to the Next.js web container.
#
# Because api and web are served from one origin here, the browser never makes
# a cross-origin request and NEXT_PUBLIC_API_BASE_URL can be the relative path
# /api/v1 — which is why this deployment has no CORS step.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # Docker's embedded DNS server. Combined with the variables in proxy_pass
    # below, this defers name resolution to request time — so nginx starts even
    # if `api` or `web` is not listening yet, instead of failing at boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default "upgrade";
        ''      close;
    }

    # Health monitoring log format read by the Elastic Beanstalk health agent.
    log_format healthd '$msec"$uri"$status"$request_time"$upstream_response_time"$http_x_forwarded_for';

    server {
        listen 80 default_server;

        # Exports can be large; do not buffer a whole CSV before responding.
        proxy_buffering off;
        client_max_body_size 10m;

        access_log /var/log/nginx/access.log;

        # Elastic Beanstalk enhanced health reads an hourly-rotated log at this
        # exact path pattern.
        if ($time_iso8601 ~ "^(\d{4})-(\d{2})-(\d{2})T(\d{2})") {
            set $year  $1;
            set $month $2;
            set $day   $3;
            set $hour  $4;
        }
        access_log /var/log/nginx/healthd/application.log.$year-$month-$day-$hour healthd;

        # ------------------------------------------------------------------
        # API routes. `/health` and `/ready` are deliberately outside the
        # api/v1 prefix in apps/api/src/main.ts, so they are matched here as
        # exact paths rather than under /api/.
        # ------------------------------------------------------------------
        location /api/ {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /health {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            include /etc/nginx/proxy_headers.conf;
            access_log off;
        }

        location = /ready {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        location /docs {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        # ------------------------------------------------------------------
        # Everything else is the Next.js application.
        # ------------------------------------------------------------------
        location / {
            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            include /etc/nginx/proxy_headers.conf;
        }
    }
}
